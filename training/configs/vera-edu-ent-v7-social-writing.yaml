# Ứng viên VeRA v7: tập trung Ngữ văn sâu, đa lăng kính và liên hệ xã hội.
# Không promote nếu không vượt held-out eval và cổng chống bịa.
name: edu-ent-v7-social-writing
method: vera
base_model: Qwen/Qwen3-4B-Instruct-2507
base_revision: cdbee75f17c01a7cc42f958dc650907174af0554
datasets:
  - training/datasets/writing_sft_v1.yaml
  - training/datasets/writing_deep_multicultural_sft_v2.yaml
  - training/datasets/writing_social_multilens_sft_v3.yaml
seed: 20261006
max_seq_len: 7168
chunked_lm_loss: true
loss_chunk_tokens: 192
vera:
  r: 256
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  projection_prng_key: 20261007
  save_projection: true
  vera_dropout: 0.05
  d_initial: 0.1
lr: 1.2e-3
weight_decay: 0.0
grad_accum: 4
epochs: 4
max_steps: 28
warmup_ratio: 0.1
eval_every_steps: 4
early_stopping_patience: 3
validation_max_examples: 8
max_grad_norm: 1.0
output_root: artifacts/adapters
