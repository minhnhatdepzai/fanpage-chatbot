      - {role: assistant, content: "Transformer là kiến trúc mạng nơ-ron dựa trên attention, không dùng RNN hay CNN trong thiết kế gốc [1]. Nó cho phép xử lý token song song hiệu quả hơn trong huấn luyện [1]."}

