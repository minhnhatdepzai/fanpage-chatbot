  - id: r2_free_tuition
    category: sourced_rich
    sources: [mien-hoc-phi-2025]
    split: val
    messages:
      - {role: user, content: "Miễn học phí áp dụng thế nào, giải thích rõ công và tư"}
      - role: assistant
        content: |-
          Từ năm học 2025-2026, trẻ mầm non và học sinh phổ thông tại cơ sở giáo dục công lập trên toàn quốc được miễn học phí [1]. Với trường tư thục và dân lập, chính sách trong nguồn là **hỗ trợ học phí**, không đồng nghĩa mọi khoản học phí đều được miễn hoàn toàn [1].

          Bạn nên phân biệt ba khái niệm:
          - **Miễn học phí:** không thu phần học phí thuộc phạm vi chính sách.
          - **Hỗ trợ học phí:** Nhà nước hỗ trợ theo mức được quy định; nếu mức thu của trường cao hơn, gia đình có thể vẫn phải trả phần chênh lệch.
          - **Các khoản khác:** tiền ăn, xe đưa đón, đồng phục, dịch vụ bán trú hoặc hoạt động tự nguyện không tự động trở thành học phí.

          Nguồn hiện có không nêu mức hỗ trợ cụ thể theo từng địa phương hay từng trường, nên mình không đoán con số. Để biết số tiền thực đóng, phụ huynh nên xem thông báo thu của nhà trường và văn bản triển khai tại địa phương, rồi yêu cầu tách rõ học phí với các khoản dịch vụ. Chính sách miễn/hỗ trợ là điểm xuất phát; hóa đơn thực tế còn phụ thuộc loại trường và các dịch vụ gia đình đăng ký.

  - id: r2_checkpointing_val
    category: sourced_rich
    sources: [cuda-oom-checkpointing]
    split: val
    messages:
      - {role: user, content: "Bật gradient checkpointing có làm model kém đi không?"}
      - role: assistant
        content: |-
          Gradient checkpointing chủ yếu đổi **thời gian tính toán lấy bộ nhớ**, không phải một kỹ thuật cố ý làm giảm năng lực model. Thay vì giữ mọi activation từ lượt forward tới backward, hệ thống bỏ bớt và tính lại khi cần gradient, nhờ đó giảm VRAM nhưng train chậm hơn [1].

          Về mặt thực hành, bạn nên so trong cùng điều kiện: seed, dữ liệu, batch hiệu dụng, learning rate và số step. Nếu phải giảm batch khi không bật checkpointing, hai lần chạy đã không còn tương đương. Ngoài ra, một số khác biệt nhỏ có thể đến từ tính không hoàn toàn xác định của kernel GPU chứ không nhất thiết do checkpointing làm “hỏng” model.

          Tài liệu PyTorch yêu cầu truyền rõ `use_reentrant` và khuyến nghị `use_reentrant=False` cho API checkpoint hiện tại [1]. Sau khi bật, hãy theo dõi ba chỉ số: peak VRAM có giảm không, mỗi step chậm thêm bao nhiêu, và validation loss có diễn biến bình thường không. Nếu VRAM đủ rộng và tốc độ quan trọng hơn, bạn có thể tắt; nếu sequence dài hoặc batch không vừa GPU, bật checkpointing thường là đánh đổi hợp lý.

  - id: r2_rag_limits_val
    category: sourced_rich
    sources: [rag-2020]
    split: val
    messages:
      - {role: user, content: "Có RAG rồi thì chatbot có hết bịa không?"}
      - role: assistant
        content: |-
          Không. RAG có thể làm câu trả lời cụ thể và đúng sự thật hơn trong các tác vụ được nghiên cứu, nhưng không phải bảo đảm tuyệt đối [1]. Hệ thống vẫn có thể lấy nhầm tài liệu, dùng nguồn cũ, bỏ sót đoạn quan trọng hoặc diễn giải vượt quá nội dung đã truy xuất.

          Có ba điểm cần kiểm soát. Thứ nhất là **retrieval**: câu hỏi phải tìm đúng đoạn, không chỉ đoạn có nhiều từ khóa giống nhau. Thứ hai là **generation**: model phải giới hạn khẳng định theo nguồn và gắn citation đúng vị trí. Thứ ba là **freshness**: nguồn cần có ngày cập nhật và phải được tra lại với câu hỏi “mới nhất”.

          Cách giảm bịa là kết hợp nhiều lớp: ưu tiên nguồn chính thức, lưu URL và thời điểm truy xuất, yêu cầu model nói “chưa đủ dữ kiện” khi nguồn thiếu, kiểm tra citation/URL sau khi sinh, và chạy bộ eval có câu cố tình gây áp lực. Với dữ liệu động, nên tìm web hoặc kho mới ở mỗi lượt phù hợp thay vì train lại model để nhớ. RAG làm model có tài liệu để dựa vào; chất lượng cuối cùng vẫn phụ thuộc toàn bộ pipeline.

