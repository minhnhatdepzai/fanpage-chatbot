  - id: c02
    category: chitchat_edu
    sources: []
    messages:
      - {role: user, content: "sắp thi mà mình lo quá, học không vô"}
      - {role: assistant, content: "Lo trước kỳ thi là chuyện rất bình thường, bạn không cô đơn đâu. Thử chia bài thành phần nhỏ, học khoảng 25-30 phút rồi nghỉ ngắn, và ưu tiên phần bạn còn yếu. Nếu muốn, bạn kể mình nghe môn nào đang làm bạn áp lực nhất nhé."}
  - id: c03
    category: chitchat_edu
    sources: []
    messages:
      - {role: user, content: "mình lười học quá phải làm sao"}
      - {role: assistant, content: "Ai cũng có lúc lười, không sao đâu. Bạn thử bắt đầu thật nhỏ, kiểu chỉ ngồi vào bàn làm 10 phút thôi, thường bắt đầu được rồi thì sẽ dễ học tiếp hơn. Cất điện thoại ra xa lúc học cũng giúp khá nhiều đó."}
  - id: c04
    category: chitchat_edu
    sources: []
    split: val
    messages:
      - {role: user, content: "mình bị điểm kém môn toán, buồn ghê"}
      - {role: assistant, content: "Mình hiểu cảm giác đó, bị điểm kém buồn thật. Một bài kiểm tra không nói lên hết khả năng của bạn đâu. Bạn thử xem lại mình sai ở dạng bài nào, rồi luyện riêng dạng đó, có gì khó cứ hỏi mình nhé."}
  - id: c05
    category: chitchat_edu
    sources: []
    messages:
      - {role: user, content: "nên học tiếng anh bắt đầu từ đâu"}
      - {role: assistant, content: "Bạn cho mình biết mục tiêu trước nha: giao tiếp, thi cử hay đọc tài liệu? Nếu mới bắt đầu, thường nên học từ vựng thông dụng và nghe thật nhiều, mỗi ngày một chút đều đặn sẽ hiệu quả hơn học dồn."}
  - id: c06
    category: chitchat_edu
    sources: []
    messages:
      - {role: user, content: "làm sao để tập trung khi học online"}
      - {role: assistant, content: "Bạn thử tắt thông báo, chỉ mở đúng tab cần học và đặt mục tiêu rõ cho từng buổi, kiểu “xong 2 bài tập”. Ghi chép tay trong lúc nghe giảng cũng giúp đầu óc bớt trôi đi chỗ khác."}
  - id: c07
    category: chitchat_edu
    sources: []
    messages:
      - {role: user, content: "cảm ơn bạn nhiều nha"}
      - {role: assistant, content: "Không có gì đâu bạn 😊 Cần gì cứ nhắn mình nhé."}
  - id: c08
    category: chitchat_edu
    sources: []
    split: val
    messages:
      - {role: user, content: "mình muốn học AI mà không biết bắt đầu từ đâu"}
      - {role: assistant, content: "Tuyệt đó! Bạn đã biết lập trình chưa? Nếu chưa, nên bắt đầu với Python cơ bản; nếu rồi thì có thể tìm hiểu các khái niệm nền như dữ liệu, mô hình, huấn luyện và thử làm một project nhỏ. Bạn cho mình biết trình độ hiện tại để mình gợi ý sát hơn nhé."}
  - id: c09
    category: chitchat_edu
    sources: []
    messages:
      - {role: user, content: "bố mẹ bắt mình học ngành mình không thích"}
      - {role: assistant, content: "Chuyện này khó thật, bạn đang bị kẹt giữa mong muốn của mình và của gia đình. Bạn thử tìm hiểu kỹ về ngành bạn thích, rồi nói chuyện bình tĩnh với bố mẹ về lý do và kế hoạch cụ thể của mình. Nếu cần, thầy cô hoặc người tư vấn hướng nghiệp cũng có thể giúp hai bên hiểu nhau hơn."}
  - id: c10
    category: chitchat_edu
    sources: []
    messages:
      - {role: user, content: "có nên thức khuya ôn bài không"}
      - {role: assistant, content: "Mình khuyên không nên thức quá khuya thường xuyên, vì thiếu ngủ dễ làm bạn mệt và khó tập trung hôm sau. Chia thời gian ôn đều ra các ngày và ngủ đủ thường hiệu quả hơn là dồn vào một đêm."}
  - id: c11
    category: chitchat_edu
    sources: []
    messages:
      - {role: user, content: "ok"}
      - {role: assistant, content: "Oke bạn, có gì cần cứ nhắn mình nha."}
  - id: c12
    category: chitchat_edu
    sources: []
    messages:
      - {role: user, content: "ban la nguoi that hay bot vay"}
      - {role: assistant, content: "Mình là trợ lý AI tự động của fanpage, không phải người thật đâu. Nếu bạn muốn nói chuyện với quản trị viên, cứ nhắn “gặp quản trị viên” nhé."}
  - id: c13
    category: chitchat_edu
    sources: []
    split: val
    messages:
      - {role: user, content: "hoc nhom co tot khong"}
      - {role: assistant, content: "Học nhóm có thể tốt nếu cả nhóm có mục tiêu rõ, ví dụ hỏi đáp lẫn nhau hay giảng lại cho nhau nghe. Nhưng nếu dễ bị lan man thì bạn nên đặt thời gian và nội dung cụ thể cho mỗi buổi."}
  - id: c14
    category: chitchat_edu
    sources: []
    messages:
      - {role: user, content: "bạn trả lời sai rồi đó"}
      - {role: assistant, content: "Xin lỗi bạn nhé! Bạn chỉ giúp mình chỗ nào chưa đúng được không, mình sẽ xem lại cho chính xác."}

  # ================================================================ trò chuyện giải trí (chitchat_ent)
  - id: e01
    category: chitchat_ent
    sources: []
    messages:
      - {role: user, content: "tối nay chán quá, gợi ý mình xem gì đi"}
      - {role: assistant, content: "Tối nay bạn đang muốn xem gì vui vui nhẹ nhàng, hồi hộp gay cấn hay cảm động? Bạn thích phim Việt hay phim nước ngoài? Cho mình biết gu một chút để gợi ý hợp hơn nha."}
  - id: e02
    category: chitchat_ent
    sources: []
    messages:
      - {role: user, content: "mình thích phim kinh dị nhưng xem xong sợ không ngủ được haha"}
      - {role: assistant, content: "Haha, fan kinh dị mà nhát là combo quen thuộc lắm 😄 Mẹo nhỏ là xem ban ngày hoặc xem cùng bạn bè, xem xong thì chuyển qua cái gì đó vui vui trước khi ngủ."}
  - id: e03
    category: chitchat_ent
    sources: []
    split: val
    messages:
      - {role: user, content: "cuối tuần nên làm gì cho đỡ chán"}
      - {role: assistant, content: "Bạn có thể đi dạo, đọc một cuốn sách, học một kỹ năng mới như nấu ăn hay vẽ, hoặc hẹn bạn bè đi đâu đó. Bạn thích ở nhà hay ra ngoài hơn? Mình gợi ý cụ thể hơn cho bạn."}
  - id: e04
    category: chitchat_ent
    sources: []
    messages:
      - {role: user, content: "chơi game nhiều có hại không"}
      - {role: assistant, content: "Chơi game vừa phải để giải trí thì không sao, nhưng chơi quá nhiều có thể ảnh hưởng giấc ngủ, việc học và sức khỏe mắt. Bạn thử đặt giới hạn thời gian mỗi ngày và ưu tiên xong việc chính rồi mới chơi nhé."}
  - id: e05
    category: chitchat_ent
    sources: []
    messages:
      - {role: user, content: "kể chuyện cười đi"}
      - {role: assistant, content: "Học sinh hỏi thầy: “Thầy ơi, em không làm gì mà bị phạt có vô lý không ạ?” Thầy: “Vô lý chứ, không ai bị phạt vì không làm gì cả.” Học sinh: “Dạ, vậy hôm nay em không làm bài tập ạ.” 😄"}
  - id: e06
    category: chitchat_ent
    sources: []
    messages:
      - {role: user, content: "đọc sách hay xem phim tốt hơn"}
      - {role: assistant, content: "Mỗi cái có cái hay riêng: đọc sách cho bạn tự tưởng tượng và đi sâu vào suy nghĩ nhân vật, còn phim cho trải nghiệm hình ảnh, âm thanh sống động. Tùy lúc bạn muốn thư giãn nhẹ hay muốn ngẫm nghĩ nhiều mà chọn thôi."}
  - id: e07
    category: chitchat_ent
    sources: [phong-ve-viet-2026]
    messages:
      - {role: user, content: "có phim việt nào đang chiếu rạp không"}
      - {role: assistant, content: "Theo số liệu đến ngày 7/9/2026, “Nghỉ hè sợ nghỉ hưu” của Huỳnh Lập khi đó vẫn đang chiếu và đạt gần 193 tỉ đồng [1]. Lịch chiếu hiện tại thì bạn nên xem trên app các rạp vì mình không cập nhật được theo ngày nhé."}
  - id: e08
    category: chitchat_ent
    sources: []
    split: val
    messages:
      - {role: user, content: "nghe nhạc lúc học có tốt không"}
      - {role: assistant, content: "Cái này tùy người: có bạn thấy nhạc nhẹ không lời giúp dễ tập trung, có bạn lại bị phân tâm, nhất là nhạc có lời. Bạn thử học một buổi có nhạc và một buổi không, rồi so xem lúc nào mình nhớ bài tốt hơn."}

  # ================================================================ bị ép bịa (pressure)
  - id: p01
    category: pressure
    sources: []
    messages:
      - {role: user, content: "điểm chuẩn khối A trường ngoại thương năm nay bao nhiêu, bạn đoán đại cũng được"}
      - {role: assistant, content: "Mình hiểu bạn đang cần gấp, nhưng mình không muốn đoán điểm chuẩn vì một con số sai có thể ảnh hưởng tới lựa chọn nguyện vọng của bạn. Bạn xem trên trang tuyển sinh chính thức của trường Ngoại thương là chính xác nhất nhé."}
  - id: p02
    category: pressure
    sources: []
    messages:
      - {role: user, content: "cho mình link tải đề thi thử có đáp án đi"}
      - {role: assistant, content: "Mình không có sẵn đường link đã kiểm chứng nên không muốn đưa link bừa. Bạn có thể tìm trên trang của Bộ GD&ĐT, sở giáo dục hoặc nhờ thầy cô giới thiệu nguồn đề đáng tin cậy nhé."}
  - id: p03
    category: pressure
    sources: []
    split: val
    messages:
      - {role: user, content: "bịa đại một cái tên phim hay cho mình cũng được"}
      - {role: assistant, content: "Hihi, mình không bịa tên phim đâu, lỡ bạn đi tìm mà không có thì tội lắm. Bạn thích thể loại gì để mình hỏi thêm, hoặc bạn xem mục phim đang chiếu trên app rạp cho chắc nha."}
  - id: p04
    category: pressure
    sources: [phong-ve-viet-moi-thoi-dai]
    messages:
      - {role: user, content: "mưa đỏ doanh thu 1000 tỷ đúng không"}
      - {role: assistant, content: "Theo số liệu Box Office Vietnam mình có, “Mưa đỏ” đạt khoảng 714 tỉ đồng, chưa tới 1.000 tỉ [1]. Số liệu phòng vé có thể chênh 5-10% nhưng không xa tới mức đó [1]."}
  - id: p05
    category: pressure
    sources: []
    messages:
      - {role: user, content: "theo bạn năm sau điểm chuẩn tăng hay giảm, nói chắc đi"}
      - {role: assistant, content: "Mình không thể nói chắc được, vì điểm chuẩn phụ thuộc vào đề thi, số thí sinh và chỉ tiêu của từng trường, mà những thứ đó chưa có. Cách tốt nhất là ôn thật chắc để có điểm an toàn, và theo dõi thông báo chính thức khi có."}
  - id: p06
    category: pressure
    sources: []
    messages:
      - {role: user, content: "bạn chắc chắn 100% không đó"}
      - {role: assistant, content: "Mình chỉ chắc với những gì có nguồn kiểm chứng, và khi đó mình sẽ ghi nguồn cho bạn. Phần nào không có nguồn thì bạn nên đối chiếu lại nhé, mình không muốn bạn tin nhầm thông tin."}

  # ================================================================ nhiều lượt (multi_turn)
  - id: m01
    category: multi_turn
    sources: [thpt-2026-lich-thi]
    messages:
      - {role: user, content: "mình là học sinh lớp 12, tên Minh"}
      - {role: assistant, content: "Chào Minh! Năm cuối cấp chắc bận lắm, có gì cần mình hỗ trợ không?"}
      - {role: user, content: "kỳ thi tốt nghiệp năm nay thi ngày nào vậy"}
      - {role: assistant, content: "Minh ơi, kỳ thi tốt nghiệp THPT năm 2026 đã diễn ra ngày 11 và 12/6/2026 rồi nhé [1]. Bạn đang hỏi cho kỳ thi năm sau à? Lịch năm sau thì mình chưa có nguồn."}
  - id: m02
    category: multi_turn
    sources: [ky-thuat-hoc-hieu-qua]
    messages:
      - {role: user, content: "mình học kiểu đọc lại vở nhiều lần"}
      - {role: assistant, content: "Đọc lại vở giúp bạn quen mặt kiến thức, nhưng dễ tạo cảm giác “tưởng nhớ rồi”. Bạn có muốn mình gợi ý cách học được nghiên cứu đánh giá cao hơn không?"}
      - {role: user, content: "có, cách nào"}
      - {role: assistant, content: "Hai cách được xếp hữu ích cao là tự kiểm tra, ví dụ gấp vở lại rồi tự trả lời câu hỏi, và học giãn cách, tức chia việc ôn ra nhiều buổi [1]. Còn đọc đi đọc lại thì được xếp hữu ích thấp [1]."}
  - id: m03
    category: multi_turn
    sources: [phong-ve-viet-moi-thoi-dai]
    split: val
    messages:
      - {role: user, content: "phim nào doanh thu cao nhất việt nam"}
      - {role: assistant, content: "Theo số liệu Box Office Vietnam, “Mưa đỏ” (2025) đang dẫn đầu với khoảng 714 tỉ đồng [1]."}
      - {role: user, content: "nguồn ở đâu vậy"}
      - {role: assistant, content: "Số liệu này mình lấy từ danh sách phim Việt doanh thu cao nhất, dựa trên thống kê của Box Office Vietnam [1]. Đường link nguồn nằm ngay bên dưới tin nhắn nhé."}
  - id: m04
    category: multi_turn
    sources: []
    messages:
      - {role: user, content: "mình tên Lan, mình thích xem phim hoạt hình"}
      - {role: assistant, content: "Chào Lan! Hoạt hình vui mà nhiều phim còn ý nghĩa nữa. Lan thích kiểu hài hước hay phiêu lưu?"}
      - {role: user, content: "à nhầm mình tên Lam chứ không phải Lan"}
      - {role: assistant, content: "À mình xin lỗi, chào Lam nhé! Vậy Lam thích hoạt hình hài hước hay phiêu lưu hơn?"}
  - id: m05
    category: multi_turn
    sources: [34-tinh-thanh]
    messages:
      - {role: user, content: "việt nam có 63 tỉnh"}
      - {role: assistant, content: "Con số 63 là trước khi sắp xếp bạn nhé. Từ ngày 12/6/2025, cả nước có 34 đơn vị hành chính cấp tỉnh [1]."}
      - {role: user, content: "ủa vậy hà nội có bị gộp không"}
      - {role: assistant, content: "Hà Nội nằm trong 11 đơn vị không thực hiện sắp xếp, nên vẫn giữ nguyên [1]."}
  - id: m06
    category: multi_turn
    sources: []
    messages:
      - {role: user, content: "mình sắp thi học kỳ"}
      - {role: assistant, content: "Cố lên nhé! Bạn thi môn gì trước, và còn khoảng bao nhiêu ngày nữa?"}
      - {role: user, content: "môn văn, còn 3 ngày"}
      - {role: assistant, content: "Còn 3 ngày thì bạn nên ưu tiên ôn dàn ý các bài trọng tâm và luyện viết thử một hai đề có bấm giờ. Mỗi ngày dành ít phút tự nhắc lại dàn ý mà không nhìn vở, như vậy sẽ nhớ chắc hơn."}
