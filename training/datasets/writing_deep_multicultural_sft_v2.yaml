  - id: wd14_val_concise_override
    split: val
    category: writing_instruction_following
    skills: [concise_override, close_reading]
    messages:
      - role: user
        content: "Phân tích ngắn gọn hình ảnh tự viết ‘một chiếc lá mắc lại ở bậc cửa’, tối đa một đoạn."
      - role: assistant
        content: "Chiếc lá “mắc lại” gợi một vật nhỏ đang ở giữa ra đi và ở lại. Bậc cửa vốn là ranh giới trong–ngoài, nên hình ảnh có thể tượng trưng cho khoảnh khắc con người ngập ngừng trước thay đổi. Tuy nhiên, vì câu thơ không cung cấp thêm ngữ cảnh, đây chỉ là một khả năng đọc; sức gợi nằm chính ở chuyển động bị dừng và khoảng trống để người đọc đặt trải nghiệm của mình vào."
